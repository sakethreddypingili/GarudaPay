<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garuda Pay Notifications</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <a href="/index.html" class="logo">
                <span class="logo-icon">G</span>
                <span>Garuda Pay</span>
            </a>

            <nav class="side-nav">
                <a href="/src/html/dashboard.html">Overview</a>
                <a href="/src/html/profile.html">Profile & Security</a>
                <a href="/src/html/app.html#topup">Wallet & Top-up</a>
                <a href="/src/html/app.html#send">Send Money</a>
                <a href="/src/html/app.html#transactions">Transactions</a>
                <a href="/src/html/notifications.html" class="active">Notifications</a>
                <a href="/src/html/settings.html">Preferences</a>
                <a href="/src/html/contact.html">Help & Support</a>
                <a href="/index.html">Logout</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="topbar">
                <button class="menu-button" id="menuButton" aria-label="Open sidebar">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div>
                    <p class="section-label">Notifications</p>
                    <h1>Payment updates</h1>
                </div>
                <a href="/src/html/dashboard.html" class="notification-link">Dashboard</a>
            </header>

            <section class="panel notifications-panel">
                <div class="panel-header">
                    <h2>All Notifications</h2>
                    <span>Today</span>
                </div>
                <div class="notifications-list" id="notificationsList">
                    <p class="empty-text">Loading notifications...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/auth-check.js"></script>
    <script src="../js/notifications.js"></script>
</body>
</html>
