<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garuda Pay Settings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .settings-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-card {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .form-card h2 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #1b3a6a;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #64748B;
            margin-bottom: 8px;
        }
        .form-select, .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
            transition: all 0.2s ease;
        }
        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: #1b3a6a;
            box-shadow: 0 0 0 3px rgba(27, 58, 106, 0.1);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            user-select: none;
        }
        .btn-submit {
            background: #1b3a6a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background: #12284c;
            transform: translateY(-1px);
        }
        .status-msg {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-success { color: #10B981; }
        .status-error { color: #EF4444; }
        
        /* Dark theme styling hooks */
        body.dark-theme {
            --bg-light: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        body.dark-theme .topbar, body.dark-theme .sidebar {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        body.dark-theme .logo, body.dark-theme h1, body.dark-theme h2, body.dark-theme h3 {
            color: #38bdf8 !important;
        }
        body.dark-theme .form-select, body.dark-theme .form-input {
            background-color: #0f172a;
            color: white;
            border-color: #475569;
        }
        body.dark-theme .btn-submit {
            background: #38bdf8;
            color: #0f172a;
        }
        body.dark-theme .btn-submit:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <a href="../../index.html" class="logo">
                <span class="logo-icon">G</span>
                <span>Garuda Pay</span>
            </a>

            <nav class="side-nav">
                <a href="dashboard.html">Overview</a>
                <a href="profile.html">Profile & Security</a>
                <a href="app.html#topup">Wallet & Top-up</a>
                <a href="app.html#send">Send Money</a>
                <a href="app.html#transactions">Transactions</a>
                <a href="notifications.html">Notifications</a>
                <a href="settings.html" class="active">Preferences</a>
                <a href="contact.html">Help & Support</a>
                <a href="../../index.html">Logout</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="topbar">
                <button class="menu-button" id="menuButton" aria-label="Open sidebar">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div>
                    <p class="section-label">Account Settings</p>
                    <h1>Preferences</h1>
                </div>
                <a href="dashboard.html" class="notification-link">Dashboard</a>
            </header>

            <section class="settings-container">
                <div class="form-card">
                    <h2>Application Preferences</h2>
                    <form id="preferencesForm">
                        <div class="form-group">
                            <label for="themeSelect">Display Theme</label>
                            <select id="themeSelect" class="form-select">
                                <option value="light">Light Mode (Clean, Professional)</option>
                                <option value="dark">Dark Mode (Sleek, Modern)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="currencySelect">Preferred Currency</label>
                            <select id="currencySelect" class="form-select">
                                <option value="INR">Indian Rupee (₹)</option>
                                <option value="USD">US Dollar ($)</option>
                                <option value="EUR">Euro (€)</option>
                            </select>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="notificationsCheckbox">
                            <label for="notificationsCheckbox">Enable Email Notifications & Transaction Alerts</label>
                        </div>

                        <button type="submit" class="btn-submit" id="settingsSubmit">Save Preferences</button>
                        <p id="settingsStatus" class="status-msg"></p>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- Ensure dark-theme style applies immediately when script loads -->
    <script src="../js/auth-check.js"></script>
    <script src="../js/settings.js"></script>
</body>
</html>
