<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garuda Pay Notifications</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <a href="landing.html" class="logo">
                <span class="logo-icon">G</span>
                <span>Garuda Pay</span>
            </a>

            <nav class="side-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Wallet</a>
                <a href="#">Send Money</a>
                <a href="#">Transactions</a>
                <a href="notifications.html" class="active">Notifications</a>
                <a href="#">Settings</a>
                <a href="landing.html">Logout</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="topbar">
                <button class="menu-button" id="menuButton" aria-label="Open sidebar">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div>
                    <p class="section-label">Notifications</p>
                    <h1>Payment updates</h1>
                </div>
                <a href="dashboard.html" class="notification-link">Dashboard</a>
            </header>

            <section class="panel notifications-panel">
                <div class="panel-header">
                    <h2>All Notifications</h2>
                    <span>Today</span>
                </div>
                <div class="notifications-list" id="notificationsList">
                    <p class="empty-text">Loading notifications...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/notifications.js"></script>
</body>
</html>
