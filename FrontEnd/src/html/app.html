<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GarudaPay Wallet</title>
    <!-- Fonts: Outfit and Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <!-- GUEST AUTH CONTAINER -->
    <div class="container" id="guestAuthContainer" style="display: none; max-width: 450px; margin: 80px auto;">
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="/" class="logo" style="text-decoration: none; font-size: 32px; font-weight: 800;">GarudaPay</a>
        </div>
        <!-- LOGIN VIEW -->
        <div id="loginView" class="view">
            <div class="card">
                <h3>Welcome Back</h3>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" class="form-input" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" class="form-input" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="nav-btn" style="width: 100%; padding: 12px; margin-left: 0; background-color: var(--brand-primary); color: white;">Sign In</button>
                </form>
                <div style="margin-top: 16px; text-align: center; font-size: 14px;">
                    <a href="#" id="linkForgotPassword" style="color: var(--brand-primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
                </div>
                <div style="margin-top: 12px; text-align: center; font-size: 14px; color: var(--text-secondary);">
                    Don't have an account? <a href="#" id="linkRegister" style="color: var(--brand-primary); text-decoration: none; font-weight: 600;">Register here</a>
                </div>
            </div>
        </div>
        <!-- Other guest views (register, etc.) -->
    </div>

    <!-- AUTHENTICATED DASHBOARD LAYOUT -->
    <div class="dashboard-layout" id="appDashboardLayout" style="display: none;">
        
        <!-- Refactored Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/" class="logo" style="font-size: 24px;">GarudaPay</a>
            </div>
            
            <nav class="side-nav">
                <span class="nav-section-title">Wallet</span>
                <a href="#dashboard" id="sideNavDashboard" class="side-nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span>Overview</span>
                </a>
                <a href="#send" id="sideNavSend" class="side-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    <span>Send & Request</span>
                </a>
                <a href="#topup" id="sideNavTopUp" class="side-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m-15.357-2a8.001 8.001 0 0115.357-2m0 0H15"/></svg>
                    <span>Add Money</span>
                </a>
                <a href="#transactions" id="sideNavHistory" class="side-nav-link">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                    <span>History</span>
                </a>

                <span class="nav-section-title">Account</span>
                <a href="profile.html" class="side-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span>Profile</span>
                </a>
                 <a href="notifications.html" class="side-nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                    <span>Notifications</span>
                </a>
                <a href="settings.html" class="side-nav-link">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-widget">
                    <div class="user-avatar" id="sidebarAvatar"></div>
                    <div class="user-info">
                        <span class="user-name" id="sidebarUserName">User</span>
                        <span class="user-email" id="sidebarUserEmail">user@email.com</span>
                    </div>
                </div>
                <button class="logout-btn" id="sideNavLogout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-main">
            <header class="topbar">
                <button class="menu-button" id="menuButton" aria-label="Open sidebar">
                    <span></span><span></span><span></span>
                </button>
                <h1 id="appDashboardTitle" class="topbar-title">Overview</h1>
                <a href="notifications.html" class="notification-link">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                </a>
            </header>

            <div class="app-views-container">
                <!-- All SPA views will be dynamically displayed here -->
                <!-- 1. WALLET DASHBOARD VIEW -->
                <div id="dashboardView" class="view">
                    <!-- Balance Card -->
                    <div class="card">
                        <div class="balance-title">WALLET BALANCE</div>
                        <div class="balance-amount" id="balanceText">₹0.00</div>
                        <button class="nav-btn" id="quickAddBtn" style="background:var(--brand-primary); color:white;">+ Add Money</button>
                    </div>
                    <!-- Transaction History Card -->
                    <div class="card">
                        <h3>Recent Transactions</h3>
                        <div id="transactionsList"></div>
                    </div>
                </div>
                <!-- Other views (topup, send, history) -->
            </div>
        </main>
    </div>

    <!-- Modal remains the same -->
    <div id="txDetailsModal" class="modal-overlay">
        <!-- ... modal content ... -->
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
