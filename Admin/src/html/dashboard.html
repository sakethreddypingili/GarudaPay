<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GarudaPay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/src/css/style.css">
    <style>
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .sidebar-nav {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .sidebar-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
        .sidebar-nav a.active {
            color: var(--brand-primary);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo"><a href="/" style="color: var(--brand-primary); text-decoration: none;">GarudaPay Admin</a></div>
        <div>
            <button class="nav-btn" onclick="window.location.href='/'">Main Site</button>
        </div>
    </header>

    <div class="container" style="margin-top: 40px;">
        <div class="sidebar-nav">
            <a href="/admin/src/html/dashboard.html" class="active">Stats Overview</a>
            <a href="/admin/src/html/users.html">User Management</a>
        </div>

        <h2>Platform Overview</h2>
        
        <div class="admin-grid">
            <div class="card">
                <div class="balance-title">Total Active Users</div>
                <div class="balance-amount" id="statUsers" style="font-size: 32px; margin-top: 8px;">...</div>
            </div>
            <div class="card">
                <div class="balance-title">Total Escrow Balance</div>
                <div class="balance-amount" id="statBalance" style="font-size: 32px; margin-top: 8px;">...</div>
            </div>
            <div class="card">
                <div class="balance-title">Total Transactions Logged</div>
                <div class="balance-amount" id="statTransactions" style="font-size: 32px; margin-top: 8px;">...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const res = await fetch("/api/admin/stats");
                if (res.status === 401 || res.status === 403) {
                    alert("Access denied. Please log in as admin.");
                    window.location.href = "../../index.html";
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    document.getElementById("statUsers").innerText = data.stats.totalUsers;
                    document.getElementById("statBalance").innerText = "₹" + data.stats.totalBalance.toLocaleString('en-IN', { minimumFractionDigits: 2 });
                    document.getElementById("statTransactions").innerText = data.stats.totalTransactions;
                }
            } catch (err) {
                console.error(err);
            }
        }
        window.addEventListener("DOMContentLoaded", loadStats);
    </script>
</body>
</html>
