<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | GarudaPay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/src/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="card">
            <h3>Admin Portal Login</h3>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label class="form-label" for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="Enter your admin email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="nav-btn" style="width: 100%; padding: 12px; margin-left: 0;">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Check if the user is an admin
                    const userRes = await fetch('/api/auth/me');
                    const userData = await userRes.json();
                    if(userData.success && userData.user.role === 'admin') {
                        window.location.href='/admin/src/html/dashboard.html';
                    } else {
                        alert('You are not authorized to access the admin portal.');
                    }
                } else {
                    alert('Login failed: ' + (data.message || 'Unknown error'));
                }
            } catch (err) {
                console.error('Admin login error:', err);
                alert('An error occurred during login.');
            }
        });
    </script>
</body>
</html>
